name: Notify parent repo

on:
  push:
    branches: [main]

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger parent update
        env:
          PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          printf 'header = "Authorization: token %s"\n' "$PAT" | \
          curl -sf -X POST -K - \
            -H "Content-Type: application/json" \
            -d '{"event_type": "submodule-updated", "client_payload": {"submodule": "discord-utils"}}' \
            https://codeberg.org/api/v1/repos/IronFoundry/Foundry-Project/dispatches
