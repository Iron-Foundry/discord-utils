[project]
name = "discord-utils"
version = "1.0.2"
description = "Shared Discord utilities for the Iron Foundry clan."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "discord-py>=2.7.1",
    "httpx>=0.28.1",
    "kaleido==0.2.1",
    "loguru>=0.7.3",
    "pillow>=12.1.1",
    "plotly<6",
    "pydantic>=2.12.3",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "sqlalchemy[asyncio]>=2.0.49",
    "valkey>=6.1.1",
    "wavelink>=3.5.2",
]

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "docker>=7.2.0",
    "pyright>=1.1.411",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.0",
    "testcontainers>=4.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: real-infra tests needing a Valkey container (deselected by default)",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PLE",
    "ASYNC", "DTZ", "LOG", "G", "C4", "RET", "PERF", "PTH", "S",
]
allowed-confusables = ["×", "➕", "➖", "’"]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test.
"tests/**" = ["S101"]
# StrEnum of environment variable names, not credential values.
"core/config.py" = ["S105"]
