[project]
name = "discord-utils"
version = "0.1.0"
description = "Shared Discord utilities for the Iron Foundry clan."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "discord-py>=2.7.1",
    "httpx>=0.28.1",
    "kaleido==0.2.1",
    "loguru>=0.7.3",
    "pillow>=12.1.1",
    "plotly<6",
    "pydantic>=2.12.3",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "sqlalchemy[asyncio]>=2.0.49",
    "valkey>=6.1.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PLE",
    "ASYNC", "DTZ", "LOG", "G", "C4", "RET", "PERF", "PTH", "S",
]
allowed-confusables = ["×", "➕", "➖", "’"]

[tool.ruff.lint.per-file-ignores]
# StrEnum of environment variable names, not credential values.
"core/config.py" = ["S105"]
