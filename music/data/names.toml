# Session nicknames for the music player bots.
#
# A nickname is one word from each list, joined by a space, rolled once per
# session and drawn without replacement against the live set in Valkey so two
# bots are never named the same thing at once.
#
# Discord caps a nickname at 32 characters. Longest pair here is
# "Pollnivneach Distortion" at 23, and names.py asserts the whole cross product
# fits at load, so nothing silently truncates.
#
# Every OSRS word is a single token, no spaces or apostrophes. Spellings that
# could plausibly be wrong were checked against RuneLite's id constants in
# D:\claude-git-references\runelite-repo (runelite-api/src/main/java/net/
# runelite/api/{NpcID,ItemID,ObjectID}.java).

